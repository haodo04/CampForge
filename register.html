<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — Register</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="./assets/css/register.css">
</head>

<body>
  <main class="shell" role="main" aria-label="Register layout">
    <!-- LEFT PANEL -->
    <section class="visual" aria-hidden="true">
      <div class="brand">
        <img src="./assets/img/logo.png" alt="Camp Forge logo">
        <h1>Camp Forge</h1>
      </div>

      <div class="tag">
        <h2>Tạo tài khoản của bạn</h2>
        <!-- <p>Gọn nhẹ, sạch sẽ và sẵn sàng phiêu lưu</p> -->
      </div>

      <div class="badges">
        <div class="chip">Riêng tư & an toàn</div>
        <div class="chip">Tối giản & dễ sử dụng</div>
        <div class="chip">Thân thiện</div>
      </div>
    </section>

    <!-- RIGHT PANEL -->
    <section class="panel">
      <div class="card">
        <h2>Tạo tài khoản</h2>
        <p class="sub">Điền thông tin của bạn để bắt đầu.</p>

        <form id="registerForm" novalidate>

          <div class="row gap">
            <div class="field">
              <input id="first" class="input" type="text" name="first_name" placeholder=" " required />
              <label class="label" for="first">Tên</label>
            </div>

            <div class="field">
              <input id="last" class="input" type="text" name="last_name" placeholder=" " required />
              <label class="label" for="last">Họ</label>
            </div>
          </div>

          <div class="field">
            <input id="regEmail" class="input" type="email" placeholder=" " required />
            <label class="label" for="regEmail">Email</label>
            <div class="err" id="emailErr">Vui lòng nhập email hợp lệ.</div>
          </div>

          <div class="field">
            <input id="regPassword" class="input" type="password" minlength="6" placeholder=" " required />
            <label class="label" for="regPassword">Mật khẩu</label>
            <button class="toggle" type="button" onclick="togglePw('regPassword', this)">Show</button>

            <div class="pw-meter"><span id="meter"></span></div>
            <div class="err" id="pwErr">Mật khẩu phải có ít nhất 6 ký tự và chứa chữ cái và số.</div>
          </div>

          <div class="field">
            <input id="confirm" class="input" type="password" minlength="6" placeholder=" " required />
            <label class="label" for="confirm">Xác nhận mật khẩu</label>
            <button class="toggle" type="button" onclick="togglePw('confirm', this)">Hiện</button>

            <div class="err" id="cfErr">Mật khẩu không khớp.</div>
          </div>

          <label class="terms">
            <input id="agree" type="checkbox" required>
            <span>Tôi đồng ý với <a href="#">Terms</a> và <a href="#">chính sách bảo mật</a>.</span>
          </label>

          <button id="createBtn" class="btn" type="submit">Tạo tài khoản</button>

          <p class="tiny">Bạn đã có tài khoản? <a href="./login.html">Sign in</a></p>
        </form>
      </div>
    </section>
  </main>

  <!-- JS -->
  <script src="./assets/js/register.js"></script>
</body>
</html>

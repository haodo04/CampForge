<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — Basic</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f5f9;
      --card: #ffffff;
      --text: #16181d;
      --muted: #69707a;
      --line: #e5e7eb;
      --brand: #111827;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    /* Shell card đơn giản */
    .shell {
      width: min(960px, 100%);
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      overflow: hidden;
    }

    /* Left visual đơn giản */
    .visual {
      background: #ffffff;
      padding: 40px 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    .tag {
      margin-top: 56px;
    }

    .tag h2 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .tag p {
      margin: 0;
      color: var(--muted);
    }

    /* Right panel + card */
    .panel {
      background: var(--card);
      display: grid;
      place-items: center;
      padding: 40px 24px;
    }

    .card {
      width: min(460px, 92%);
      padding: 28px 24px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--card);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 600;
    }

    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    form {
      display: grid;
      gap: 14px;
    }

    .row.gap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      position: relative;
    }

    .input {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 14px 14px 6px;
      font-size: 15px;
      background: #f9fafb;
      outline: none;
    }

    .input:focus {
      border-color: var(--brand);
    }

    .label {
      position: absolute;
      left: 14px;
      top: 14px;
      font-size: 13px;
      color: #6b7280;
      pointer-events: none;
      transition: .18s ease;
      background: transparent;
    }

    .input:focus ~ .label,
    .input:not(:placeholder-shown) ~ .label {
      top: 6px;
      font-size: 11px;
      color: #4b5563;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: #4b5563;
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: var(--brand);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }

    .tiny {
      margin-top: 10px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }

    .tiny a {
      color: var(--brand);
      text-decoration: none;
    }

    .tiny a:hover {
      text-decoration: underline;
    }

    @media (max-width: 960px) {
      .shell { grid-template-columns: 1fr; }
      .visual { display: none; }
    }

    @media (max-width: 520px) {
      .row.gap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell" role="main" aria-label="Register layout">
    <!-- Left visual cơ bản -->
    <section class="visual" aria-hidden="true">
      <div class="brand">
        <img src="./assets/img/logo.png" alt="Camp Forge logo">
        <h1>Camp Forge</h1>
      </div>
      <div class="tag">
        <h2>Create your account</h2>
        <p>Soft, clean, and distraction-free onboarding.</p>
      </div>
    </section>

    <!-- Right register card -->
    <section class="panel">
      <div class="card" aria-label="Create account card">
        <h2>Create account</h2>
        <p class="sub">Fill in your details to get started.</p>

        <form id="registerForm" novalidate>
          <div class="row gap">
            <div class="field">
              <input id="first" class="input" type="text" name="first_name" placeholder=" " aria-label="First name" required />
              <label class="label" for="first">First name</label>
            </div>
            <div class="field">
              <input id="last" class="input" type="text" name="last_name" placeholder=" " aria-label="Last name" required />
              <label class="label" for="last">Last name</label>
            </div>
          </div>

          <div class="field">
            <input id="regEmail" class="input" type="email" name="email" autocomplete="email" placeholder=" " aria-label="Email" required />
            <label class="label" for="regEmail">Email</label>
          </div>

          <div class="field">
            <input id="regPassword" class="input" type="password" name="password" autocomplete="new-password" placeholder=" " aria-label="Password" minlength="6" required />
            <label class="label" for="regPassword">Password</label>
          </div>

          <div class="field">
            <input id="confirm" class="input" type="password" name="confirm_password" autocomplete="new-password" placeholder=" " aria-label="Confirm password" minlength="6" required />
            <label class="label" for="confirm">Confirm password</label>
          </div>

          <label class="terms">
            <input id="agree" type="checkbox" required />
            <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</span>
          </label>

          <button id="createBtn" class="btn" type="submit">Create account</button>
          <p class="tiny">Already have an account? <a href="./login.html">Sign in</a></p>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
